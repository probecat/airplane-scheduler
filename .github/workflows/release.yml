name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      skip-debug-apk: true

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Tag from versionName
        run: |
          version=$(sed -n "s/^ *versionName '\(.*\)'$/\1/p" app/build.gradle)
          if [ -z "$version" ]; then
            echo "::error::No versionName in app/build.gradle"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already released. Bump versionName first."
            exit 1
          fi
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
      - name: Restore signing key
        env:
          RELEASE_KEYSTORE_BASE64: "${{ secrets.RELEASE_KEYSTORE_BASE64 }}"
        run: printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
      - name: Lint and build signed APK
        env:
          RELEASE_KEYSTORE: "${{ runner.temp }}/release.p12"
          RELEASE_KEYSTORE_PASSWORD: "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}"
        run: ./gradlew lintRelease assembleRelease
      - name: Verify signed APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Tag release
        run: |
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"
      - name: Publish GitHub release
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          # A fixed name, so the README's button can link to releases/latest/download.
          cp app/build/outputs/apk/release/app-release.apk airplane-scheduler.apk
          gh release create "$RELEASE_TAG" airplane-scheduler.apk --verify-tag --generate-notes \
            --title "Airplane Scheduler $RELEASE_TAG"
      - name: Remove APKs from all but the newest three releases
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          gh release list --exclude-drafts --limit 1000 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:][].tagName' |
          while read -r tag; do
            gh release view "$tag" --json assets --jq '.assets[].name | select(endswith(".apk"))' |
            while read -r asset; do
              gh release delete-asset "$tag" "$asset" --yes
            done
          done
