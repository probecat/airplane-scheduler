name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.0
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Restore signing key
        env:
          RELEASE_KEYSTORE_BASE64: "${{ secrets.RELEASE_KEYSTORE_BASE64 }}"
        run: printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
      - name: Test, lint, and build signed APK
        env:
          RELEASE_KEYSTORE: "${{ runner.temp }}/release.p12"
          RELEASE_KEYSTORE_PASSWORD: "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}"
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease
      - name: Verify signed APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Tag release
        env:
          RELEASE_TAG: "${{ inputs.tag }}"
        run: |
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"
      - name: Publish GitHub release
        env:
          GH_TOKEN: "${{ github.token }}"
          RELEASE_TAG: "${{ inputs.tag }}"
        run: |
          cp app/build/outputs/apk/release/app-release.apk AirplaneScheduler.apk
          gh release create "$RELEASE_TAG" AirplaneScheduler.apk --verify-tag --generate-notes --title "Airplane Scheduler $RELEASE_TAG"
