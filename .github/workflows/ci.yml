name: CI

on:
  push:
    branches: [main]
    paths:
      - app/**
      - gradle/**
      - build.gradle
      - settings.gradle
      - gradle.properties
      - gradlew
      - .editorconfig
      - mise.toml
      - .github/workflows/ci.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ktlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: ktlint
      - name: Check Kotlin style
        run: ktlint --relative

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Test, lint, and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: AirplaneScheduler-debug
          path: app/build/outputs/apk/debug/app-debug.apk
