name: CI

on:
  push:
    branches: [main]
    paths:
      - app/**
      - gradle/**
      - build.gradle
      - settings.gradle
      - gradle.properties
      - gradlew
      - .editorconfig
      - mise.toml
      - .github/workflows/ci.yml
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip-debug-apk:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

jobs:
  ktlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: ktlint
      - name: Check Kotlin style
        run: ktlint --relative

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Test and lint
        run: ./gradlew testDebugUnitTest lintDebug
      - name: Build debug APK
        if: ${{ !inputs.skip-debug-apk }}
        run: ./gradlew assembleDebug
      - if: ${{ !inputs.skip-debug-apk }}
        uses: actions/upload-artifact@v7
        with:
          name: AirplaneScheduler-debug
          path: app/build/outputs/apk/debug/app-debug.apk
