[tools]
java = "temurin-17"
android-sdk = "23.0"
ktlint = "1.8.0"

[tasks.setup]
description = "Accept SDK licenses, install SDK packages (build-tools are fetched by Gradle), and add a ktlint pre-commit hook"
run = [
  "yes | sdkmanager --licenses > /dev/null",
  "sdkmanager 'platform-tools' 'platforms;android-37.0'",
  "mise generate git-pre-commit --write --task=ktlint",
]

[tasks.test]
description = "Run unit tests"
run = "./gradlew testDebugUnitTest"

[tasks.lint]
description = "Run Android Lint"
run = "./gradlew lintDebug"

[tasks.ktlint]
description = "Check Kotlin style with ktlint"
run = "ktlint"

[tasks.format]
description = "Fix Kotlin style with ktlint"
run = "ktlint --format"

[tasks.build]
description = "Build the debug APK"
run = "./gradlew assembleDebug"

[tasks.check]
description = "Check style, test, lint, and build, as CI does"
run = ["ktlint", "./gradlew testDebugUnitTest lintDebug assembleDebug"]

[tasks.run]
description = "Install the debug build on the USB device and launch it"
run = [
  "./gradlew installDebug",
  "adb shell am start -n dev.probecat.airplanescheduler.debug/dev.probecat.airplanescheduler.MainActivity",
]
